# 更新镜像：docker compose pull && docker compose up -d
services:
  moontv:
    image: ghcr.io/niudundezhanghao/moontv:latest
    container_name: moontv
    restart: unless-stopped
    environment:
      - PASSWORD=change-me
      - NEXT_PUBLIC_SITE_NAME=MoonTV
      - TZ=Asia/Shanghai
    volumes:
      - ./config.json:/app/config.json:ro
    networks:
      - web

  caddy:
    image: caddy:2-alpine
    container_name: caddy
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - web

networks:
  web:

volumes:
  caddy_data:
  caddy_config:
